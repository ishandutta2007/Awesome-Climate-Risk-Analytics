<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 18px; fill: #94a3b8; }
      .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 13px; fill: #10b981; }
      .card-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 14px; fill: #e2e8f0; }
      .card-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 12px; fill: #64748b; }
      
      @keyframes float1 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(10px); }
      }
      @keyframes pulse-wave {
        0% { stroke-dashoffset: 600; }
        50% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -600; }
      }
      .animated-float-1 { animation: float1 6s ease-in-out infinite; }
      .animated-float-2 { animation: float2 7s ease-in-out infinite; }
      .wave-line { stroke-dasharray: 300 300; animation: pulse-wave 8s linear infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic/Background Wave Graphics (Keep behind text) -->
  <g opacity="0.25">
    <path d="M-100,220 Q 200,80 500,200 T 1100,150 T 1300,250" fill="none" stroke="#10b981" stroke-width="4" class="wave-line"/>
    <path d="M-100,250 Q 300,120 700,240 T 1300,180" fill="none" stroke="#06b6d4" stroke-width="3" class="wave-line" style="animation-delay: -3s;"/>
    <circle cx="950" cy="80" r="120" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>
    <circle cx="150" cy="220" r="90" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  </g>

  <!-- Dynamic Decorative Cards (Floating on Right side) -->
  <g class="animated-float-1">
    <rect x="840" y="45" width="310" height="85" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="875" cy="87" r="18" fill="#10b981" opacity="0.2"/>
    <path d="M868 91 L873 84 L878 88 L883 81" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="908" y="78" class="card-title">Physical Hazard Engine</text>
    <text x="908" y="98" class="card-sub">CMIP6 &amp; High-Res Flood/Wildfire</text>
  </g>

  <g class="animated-float-2">
    <rect x="880" y="150" width="290" height="85" rx="12" fill="url(#card-grad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
    <circle cx="915" cy="192" r="18" fill="#06b6d4" opacity="0.2"/>
    <path d="M908 197 C912 187 918 187 922 197" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/>
    <text x="948" y="183" class="card-title">Asset Financial Impact</text>
    <text x="948" y="203" class="card-sub">TCFD &amp; NGFS Scenario Stress Test</text>
  </g>

  <!-- Foreground Title and Content -->
  <g transform="translate(60, 0)">
    <!-- Pill Badge -->
    <rect x="0" y="45" width="220" height="28" rx="14" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1"/>
    <text x="14" y="64" class="tag">⚡ CLIMATE RISK ANALYTICS</text>

    <!-- Main Title -->
    <text x="0" y="125" class="title">Awesome Climate Risk</text>
    <text x="0" y="175" class="title" fill="url(#accent-grad)">Analytics Ecosystem</text>

    <!-- Subtitle -->
    <text x="0" y="222" class="subtitle">Curated SaaS Platforms, Commercial Intelligence &amp; Open-Source Risk Engines</text>
    
    <!-- Accent Line -->
    <rect x="0" y="250" width="480" height="4" rx="2" fill="url(#accent-grad)"/>
  </g>
</svg>
